# Asked to run every hour (GitHub's scheduler actually runs it every few hours), on each push to main and when daily.yml
# asks: run the tests (Python and the page logic), re-check every row, publish the page with the fresh data and the change log.
name: Check and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest -v test_check test_daily
      - run: node --test nu7.test.js
      - run: python3 check.py --out _site/data/status.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 daily.py publish --dir history --changes _site/data/changes.json --feed _site/feed.xml
      - run: cp -r *.html style.css nu7.js app.js icons logos _site/ && touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
